<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kim planning board · loading…</title>
</head>
<body style="margin:0;background:#0f1115;color:#e8eaed;font:14px system-ui">
<p id="s" style="padding:1.5rem">Loading planning board…</p>
<script>
(async () => {
  const n = 7;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const name = String(i).padStart(2, "0") + ".b64";
    const res = await fetch("parts/" + name + "?t=" + Date.now());
    if (!res.ok) throw new Error("Failed " + name + " " + res.status);
    parts.push(await res.text());
  }
  const bin = atob(parts.join("").replace(/\s+/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = new TextDecoder("utf-8").decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch(err => {
  document.getElementById("s").textContent = "Failed to load board: " + err;
});
</script>
</body>
</html>

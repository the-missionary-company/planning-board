<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Kim planning board · loading…</title>
</head>
<body style="margin:0;background:#0f1115;color:#e8eaed;font:14px system-ui">
<p id="s" style="padding:1.5rem">Loading planning board…</p>
<script>
(async () => {
  const n = 13;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const name = "v4h" + i + ".hex";
    const res = await fetch("parts/" + name + "?t=" + Date.now());
    if (!res.ok) throw new Error("Failed " + name + " " + res.status);
    parts.push(await res.text());
  }
  const hex = parts.join("").replace(/\s+/g, "");
  const bin = new Uint8Array(hex.length / 2);
  for (let i = 0; i < bin.length; i++) bin[i] = parseInt(hex.substr(i * 2, 2), 16);
  if (!("DecompressionStream" in window)) {
    throw new Error("This browser cannot gunzip the board (needs DecompressionStream)");
  }
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch((err) => {
  document.getElementById("s").textContent = "Failed to load board: " + err;
});
</script>
</body>
</html>

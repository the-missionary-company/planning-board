<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kim planning board</title>
<script>
(async function () {
  const n = 11;
  const parts = await Promise.all(
    Array.from({ length: n }, (_, i) =>
      fetch("parts/b" + i + ".b64").then((r) => {
        if (!r.ok) throw new Error("missing part " + i + " status " + r.status);
        return r.text();
      })
    )
  );
  const bin = atob(parts.join("").replace(/\s+/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = new TextDecoder("utf-8").decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch((e) => {
  document.body.style.cssText = "font-family:system-ui;background:#0f1115;color:#e57373;padding:1rem";
  document.body.textContent = "Failed to load board: " + e;
});
</script>
</head>
<body>
<p style="font-family:system-ui;color:#9aa0a6;background:#0f1115;margin:0;padding:1rem">Loading Kim planning board…</p>
</body></html>
